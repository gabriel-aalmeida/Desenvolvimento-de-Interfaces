<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2344">
    <title>Pagamento | LuxeStay</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/hospedagens.js"></script>
    <script defer src="js/script.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#principal">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="index.html" aria-label="LuxeStay, início"><span class="brand-mark"
            aria-hidden="true">L</span> Luxe<span>Stay</span></a>
        <nav aria-label="Menu principal">
          <a href="index.html">Início</a>
          <a href="hospedagens.html">Hospedagens</a>
          <a href="index.html#ofertas">Black Friday</a>
          <a href="contato.html">Contato</a>
        </nav>
        <div class="header-actions">
          <details class="access">
            <summary>Acessibilidade</summary>
            <div class="access-options">
              <label for="tema">Aparência</label>
              <select id="tema">
                <option value="light">Modo claro</option>
                <option value="dark">Modo escuro</option>
              </select>
              <label for="tamanho">Tamanho do texto</label>
              <select id="tamanho">
                <option value="normal">Padrão</option>
                <option value="grande">Maior</option>
                <option value="extra">Muito maior</option>
              </select>
            </div>
          </details>
          <a class="action compact" data-account href="login.html">Entrar</a>
        </div>
      </div>
    </header>
    <main id="principal" class="shell inner-page">
      <div id="pagamento-hotel">
        <h1>Pagamento</h1><noscript>
          <p>Ative o JavaScript para revisar a reserva e abrir o pagamento.</p>
        </noscript>
      </div>
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <div><a class="brand" href="index.html">Luxe<span>Stay</span></a>
          <p>Projeto acadêmico de Desenvolvimento de Interfaces.</p>
        </div>
        <a href="contato.html">Fale com a gente</a>
      </div>
    </footer>
  </body>

</html>
